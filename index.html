<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список файлов</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            height: 100%;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100%;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
            margin: 20px 40px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 2em;
        }
        .file-list {
            list-style: none;
        }
        .file-item {
            margin-bottom: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            transition: all 0.3s ease;
            border-left: 4px solid #667eea;
        }
        .file-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        .file-link {
            text-decoration: none;
            color: #667eea;
            font-size: 1.1em;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .file-link:hover {
            color: #764ba2;
        }
        .file-icon {
            font-size: 1.2em;
        }
        .empty {
            text-align: center;
            color: #6c757d;
            padding: 40px;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📁 Список файлов</h1>
        <ul class="file-list">
            
            <li class="file-item">
                <a href="417_Mainframe.mp3" class="file-link">
                    <span class="file-icon">🎵</span>
                    <span>417_Mainframe.mp3</span>
                </a>
            </li>
            
            <li class="file-item">
                <a href="75305337ef8f53f.mp3" class="file-link">
                    <span class="file-icon">🎵</span>
                    <span>75305337ef8f53f.mp3</span>
                </a>
            </li>
            
            <li class="file-item">
                <a href="system%20%282%29.html" class="file-link">
                    <span class="file-icon">🌐</span>
                    <span>system (2).html</span>
                </a>
            </li>
            
        </ul>
    </div>
</body>
</html>
